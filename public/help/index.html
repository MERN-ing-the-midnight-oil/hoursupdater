<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Definitions · Teamster Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <div class="brand-block">
          <a href="/" class="brand-home" aria-label="Home" data-icon="home"></a>
          <div class="brand">Teamster Tracker</div>
        </div>
        <nav class="site-nav" aria-label="Primary">
          <a href="/routing" data-icon="route">Routing</a>
          <a href="/admin" data-icon="clipboard-list">Admin</a>
          <a href="/admin/drivers" data-icon="users">Drivers/Routes</a>
          <a href="/help" aria-current="page" data-icon="book-open">Definitions</a>
        </nav>
      </div>

      <section class="panel help-panel">
        <h1 data-icon="book-open">Definitions</h1>
        <p class="lead">
          In the app, click a linked term (or any
          <span class="glossary-tip-btn-static" aria-hidden="true">?</span>
          next to a label) for the same definition in place.
        </p>

        <div id="glossary-list" class="glossary-list"></div>
      </section>
    </main>

    <script type="module" src="/help/help.js"></script>
  </body>
</html>
