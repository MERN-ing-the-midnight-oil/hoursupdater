<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5c4a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Driver dashboard · Teamster Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/driver/driver.css" />
  </head>
  <body>
    <header class="top">
      <img id="driver-photo" class="driver-photo" alt="" hidden />
      <div class="top-copy">
        <p class="app-name">Teamster Tracker</p>
        <h1 id="dash-title">Driver dashboard</h1>
      </div>
      <button type="button" id="forget" class="text-btn" hidden>Forget this phone</button>
    </header>
    <p id="status" class="status" role="status"></p>
    <nav id="work" class="work-nav" hidden aria-label="Work sheets"></nav>
    <main id="main"></main>
    <nav id="tabs" class="tabs" hidden aria-label="Dashboard sections"></nav>
    <script type="module" src="/driver/driver.js"></script>
  </body>
</html>
