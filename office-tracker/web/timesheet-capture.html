<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1f4b66" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Timecard photos</title>
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./office.css" />
  </head>
  <body class="timesheet-capture-page">
    <header class="timesheet-capture-head">
      <p class="app-name">Card photos</p>
    </header>
    <p id="timesheet-capture-status" class="status" role="status" hidden></p>
    <section id="timesheet-capture-main" class="timesheet-capture-main" hidden>
      <div id="timesheet-capture-busy" class="timesheet-capture-busy" hidden>
        <span class="timesheet-spinner" aria-hidden="true"></span>
        <p id="timesheet-capture-busy-text">Sending photo…</p>
      </div>
      <!--
        Camera file input stays in the DOM. Uploads use fetch so we can show a
        spinner and open the next camera without a full page reload.
      -->
      <form
        id="timesheet-capture-form-camera"
        class="timesheet-capture-form"
        method="post"
        enctype="multipart/form-data"
        action="#"
      >
        <label id="timesheet-capture-native" class="timesheet-capture-native-btn">
          <span id="timesheet-capture-native-text">Take front photo</span>
          <input
            id="timesheet-capture-file"
            class="visually-hidden"
            name="photo"
            type="file"
            accept="image/*"
            capture="environment"
          />
        </label>
      </form>
    </section>
    <script type="module" src="./timesheet-capture.js"></script>
  </body>
</html>
