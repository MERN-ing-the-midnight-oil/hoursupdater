<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeclock and Payroll tour</title>
    <link rel="stylesheet" href="./tour.css" />
  </head>
  <!--
    Live editing is on while data-live-edit="true".
    Before publishing, set it to "false". The words saved in this browser stay.
  -->
  <body data-live-edit="true">
    <header class="top">
      <div class="top-copy">
        <p class="eyebrow">Practice office</p>
        <h1>Timeclock and Payroll</h1>
        <p class="lede">Click a picture. The screen opens. Click the words under it to rewrite them.</p>
      </div>
      <div class="edit-tools" data-edit-tools>
        <p>Editing is on. Your words stay in this browser.</p>
        <button type="button" id="download-edits">Download your words</button>
        <label class="file-btn">
          Load words
          <input id="load-edits" type="file" accept="application/json,.json" hidden />
        </label>
        <button type="button" id="reset-edits">Restore original wording</button>
      </div>
    </header>
    <main id="tour"></main>
    <dialog id="screen-dialog">
      <form method="dialog" class="dialog-bar">
        <button type="button" id="screen-prev" class="secondary">Previous</button>
        <button type="button" id="screen-next" class="secondary">Next</button>
        <button type="submit" class="close-dialog" value="close">Close</button>
      </form>
      <figure>
        <img id="screen-image" alt="" />
        <figcaption>
          <h2 id="screen-title"></h2>
          <p id="screen-text"></p>
        </figcaption>
      </figure>
    </dialog>
    <script type="module" src="./tour.js"></script>
  </body>
</html>
